<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi página web</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101522;
      color: rgb(255, 255, 255);
      text-align: center;
    }

    header {
      padding: 24px;
      background: #202a40;
    }

    main {
      padding: 70px 20px;
    }

    h1 {
      color: #70e1ff;
      font-size: 42px;
    }

    p {
      color: #d0d7e5;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      padding: 14px 24px;
      margin-top: 15px;
      background: #70e1ff;
      color: #101522;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <strong>MI PÁGINA</strong>
  </header>

  <main>
    <h1>PERFUMES A LA VENTA </h1>
    <p>Esta es mi primera página web creada desde cero.</p>
    <a href="mailto:contacto@ejemplo.com">Contáctame</a>
  </main>
</body>
</html>
